{% extends "base.html" %}
{% block title %}{{ producto.nombre }} - MiTienda{% endblock %}
{% block content %}
<article class="bg-white rounded-lg shadow p-6">
    <div class="grid md:grid-cols-2 gap-10">
        <img src="{{ producto.imagen }}" alt="{{ producto.nombre }}" class="w-full h-96 object-cover rounded-lg">
        <div class="flex flex-col justify-center">
            <p class="text-sm text-gray-500 mb-2">Producto</p>
            <h1 class="text-4xl font-bold mb-4">{{ producto.nombre }}</h1>
            <p class="text-3xl font-bold text-gray-800 mb-6">${{ "%.2f"|format(producto.precio) }}</p>
            <p class="text-gray-600 leading-7 mb-8">{{ producto.descripcion }}</p>
            <a href="{{ url_for('agregar_carrito', id=producto.id) }}"
                class="bg-yellow-400 hover:bg-yellow-500 text-center font-bold py-3 px-6 rounded-lg">🛒 Agregar al
                carrito</a>
            <a href="{{ url_for('index') }}" class="text-center mt-4 text-blue-600 hover:underline">← Volver a
                productos</a>
        </div>
    </div>
</article>
{% endblock %}
